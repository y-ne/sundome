<h1>Add KeyVal</h1>
<form method="post">
    {% csrf_token %} {% if err_msg %}
    <p><strong>{{ err_msg }}</strong></p>
    {% endif %}
    <p>
        <label for="key">Key:</label>
        <input type="text" name="key" id="key" />
    </p>
    <p>
        <label for="value">Value:</label>
        <textarea name="value" id="value"></textarea>
    </p>
    <input type="submit" value="Save" />
</form>
